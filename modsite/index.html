<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOD 站 · 卫戍协议</title>
<meta name="description" content="卫戍协议工坊包（mod）索引：查看、筛选、搜索、下载。">
<style>
/* 配色沿用 dl 站 / mod 站的既有主题（--mint-500:#4ed8af / --bg-0:#0c0f0e），保持一致观感 */
:root{
  color-scheme:dark;
  --mint-500:#4ed8af; --mint-400:#59f4ca; --mint-600:#35d8b4;
  --bg-0:#0c0f0e; --bg-1:#141816; --bg-2:#1e2421; --bg-3:#252c29;
  --line:#2f3a35; --line-2:#3e4b45;
  --text-hi:#f2f2f2; --text-md:#c3cbc7; --text-lo:#8a948f; --text-dim:#5d6863;
  --text-on-mint:#06110d;
  --gold:#ffc600; --amber:#f6a329; --red:#e73118; --ice:#9fd4ff;
  --font-cjk:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --font-mono:"Cascadia Mono",ui-monospace,Consolas,monospace;
  --radius:4px;
}
*{box-sizing:border-box}
body{margin:0;padding:0;background:var(--bg-0);color:var(--text-md);
  font:14px/1.6 var(--font-cjk)}
main{max-width:1080px;margin:0 auto;padding:28px 20px 64px}
h1{font-size:20px;margin:0 0 4px;color:var(--text-hi)}
p.sub{margin:0 0 22px;color:var(--text-lo);font-size:13px}

/* 角标卡片：两站共用的 .panel + 括号角标形态 */
.panel{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:0 0 14px}
.brackets{position:relative}
.brackets::before,.brackets::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--mint-500)}
.brackets::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.brackets::after{bottom:-1px;right:-1px;border-left:0;border-top:0}

/* 控制条 */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
input[type=search],select{
  background:var(--bg-2);border:1px solid var(--line-2);color:var(--text-hi);
  padding:8px 11px;border-radius:var(--radius);font:inherit;font-size:13px}
input[type=search]{flex:1;min-width:180px}
input[type=search]:focus,select:focus{outline:1px solid var(--mint-600)}
.count{color:var(--text-lo);font-size:12px}

/* 列表 = 分组 section + 卡片堆叠（沿用 mod 站形态） */
section{margin:0 0 22px}
section > h2{font-size:13px;color:var(--mint-400);margin:0 0 10px;letter-spacing:.05em}
.card{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;margin:0 0 10px;display:grid;grid-template-columns:1fr auto;gap:10px}
.card h3{margin:0 0 4px;font-size:14px;color:var(--text-hi);font-weight:600}
.meta{font-size:12px;color:var(--text-lo);display:flex;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.note{font-size:12.5px;color:var(--text-md);margin:4px 0 0;white-space:pre-wrap}
.right{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.size{font:12px var(--font-mono);color:var(--text-lo)}
a.dl{
  display:inline-block;padding:6px 14px;border-radius:var(--radius);
  border:1px solid var(--mint-600);background:var(--bg-2);color:var(--mint-400);
  text-decoration:none;font-size:13px;white-space:nowrap}
a.dl:hover{background:var(--mint-600);color:var(--text-on-mint)}
.tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;
  border:1px solid var(--line-2);color:var(--text-lo)}
.tag.functional{border-color:var(--mint-600);color:var(--mint-400)}
.tag.documentation{border-color:var(--line-2);color:var(--text-lo)}
.tag.unknown{border-color:var(--amber);color:var(--amber)}
code{font:12px var(--font-mono);background:var(--bg-2);padding:1px 5px;border-radius:3px;color:var(--ice)}
details{margin-top:6px}
summary{cursor:pointer;color:var(--text-lo);font-size:12px}
summary:hover{color:var(--mint-400)}
.empty{color:var(--text-dim);font-size:13px;padding:20px 0;text-align:center}
footer{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);
  color:var(--text-dim);font-size:12px;display:flex;flex-direction:column;gap:12px}
footer a{color:var(--text-lo)}
footer a:hover{color:var(--mint-400)}
footer .src{border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;background:var(--bg-1)}
footer .src b{display:block;color:var(--mint-400);font-size:12px;letter-spacing:.04em;margin-bottom:6px}
footer .srcline{line-height:1.9}
footer .note{line-height:1.7}
footer .dim{color:var(--text-dim)}
@media(max-width:640px){.card{grid-template-columns:1fr}.right{align-items:flex-start;text-align:left}}
</style>
</head>
<body>
<main>
  <h1>MOD 站 · 卫戍协议</h1>
  <p class="sub" id="sub">正在载入索引…</p>

  <div class="controls">
    <input type="search" id="q" placeholder="搜名称 / id / 说明…" autocomplete="off">
    <select id="cat">
      <option value="">全部分类</option>
      <option value="functional">真功能</option>
      <option value="documentation">说明包</option>
      <option value="unknown">未核实</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <div id="list"><div class="empty">载入中…</div></div>

  <footer>
    <div class="src">
      <b>开源地址 · Source</b>
      <div class="srcline">
        本页与索引生成器源码：
        <a id="repo" href="#">mod 仓库</a>
        <span class="dim">（GPL-3.0，欢迎自建、提 PR）</span><br>
        客户端 / MOD 管理器：
        <a id="mgr" href="#">stronghold-mod-manager</a>
        <span class="dim">（管理器规格、来源镜像与一致性闸门）</span>
      </div>
    </div>
    <div class="note">
      索引由 GitHub Actions 预生成（<code>mods.json</code>），本页是静态的：不查接口、不跑脚本、不碰 Cloudflare。
      下载直链由 <span id="store"></span> 提供。投稿请到上面的 mod 仓库提 PR，CI 通过后才合并。
    </div>
  </footer>
</main>

<script>
// 纯静态：只读一个预生成的 mods.json，不做运行时 API 调用。
// 理由（审计结论）：浏览器的匿名 api.github.com 只有 60 次/小时，且 raw 可达性按 URL 波动；
// 把 API 调用挪到 Actions 侧（GITHUB_TOKEN 1000/h），浏览器只读静态文件 —— 省额度也稳。
// 站点配置。刻意写死而不是读外部配置：多一次请求就多一个失败点，而这里两个值几乎不会变。
const CFG = {
  store: 'GitHub Releases',
  repo: 'jingjiangze/Stronghold-Protocol-Forge-Mods',   // 本页 + 索引生成器源码（GPL-3.0）
  managerRepo: 'jingjiangze/stronghold-mod-manager',     // 客户端 / MOD 管理器
};
document.getElementById('store').textContent = CFG.store;
{
  const a = document.getElementById('repo');
  a.href = 'https://github.com/' + CFG.repo;
  a.textContent = CFG.repo;
  // 开源地址要写在页面上（用户口径 2026-10-20）：标题里也带一份，收藏/分享时看得见。
  document.title = 'MOD 站 · 卫戍协议 · ' + CFG.repo;
}
{
  const a = document.getElementById('mgr');
  a.href = 'https://github.com/' + CFG.managerRepo;
  a.textContent = CFG.managerRepo;
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const mb = (n) => (Number(n) / 1048576).toFixed(1) + ' MiB';

const CAT_ORDER = ['functional', 'documentation', 'unknown'];
const CAT_TITLE = { functional: '真功能', documentation: '说明包', unknown: '未核实' };

let ALL = [];

function card(m) {
  const cat = m.category || 'unknown';
  const sha = (m.sha256 || '').slice(0, 16);
  return `<div class="card">
    <div>
      <h3>${esc(m.name || m.id)}</h3>
      <div class="meta">
        <span class="tag ${esc(cat)}">${esc(CAT_TITLE[cat] || cat)}</span>
        ${m.version ? `<span>v${esc(m.version)}</span>` : ''}
        ${m.id ? `<code>${esc(m.id)}</code>` : ''}
        ${m.fileCount ? `<span>${esc(m.fileCount)} 个文件</span>` : ''}
      </div>
      ${m.note || m.notes ? `<p class="note">${esc((m.notes || m.note || '').slice(0, 300))}</p>` : ''}
      ${sha ? `<details><summary>SHA256</summary><code>${esc(m.sha256)}</code></details>` : ''}
    </div>
    <div class="right">
      <span class="size">${m.sizeBytes ? mb(m.sizeBytes) : ''}</span>
      ${m.download ? `<a class="dl" href="${esc(m.download)}">下载</a>` : ''}
    </div>
  </div>`;
}

function render() {
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  const cat = document.getElementById('cat').value;
  const hit = ALL.filter((m) => {
    if (cat && (m.category || 'unknown') !== cat) return false;
    if (!q) return true;
    return [m.id, m.name, m.note, m.notes, m.packId].filter(Boolean).join(' ').toLowerCase().includes(q);
  });
  // 按分类分组，沿用 mod 站「列表按类目分段」的信息架构
  const groups = CAT_ORDER.map((c) => ({ c, items: hit.filter((m) => (m.category || 'unknown') === c) }))
    .filter((g) => g.items.length);
  const list = document.getElementById('list');
  document.getElementById('count').textContent = `共 ${hit.length} 个（总 ${ALL.length}）`;
  if (!hit.length) { list.innerHTML = '<div class="empty">没有匹配的 mod</div>'; return; }
  list.innerHTML = groups.map((g) =>
    `<section><h2>${esc(CAT_TITLE[g.c])}（${g.items.length}）</h2>${g.items.map(card).join('')}</section>`).join('');
}

(async () => {
  try {
    const r = await fetch('mods.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    ALL = Array.isArray(j) ? j : (j.mods || []);
    document.getElementById('sub').textContent =
      `${ALL.length} 个工坊包 · 索引由 Actions 预生成 · 下载走 ${CFG.store}`;
    render();
  } catch (e) {
    document.getElementById('list').innerHTML =
      '<div class="empty">索引载入失败：' + esc(String(e.message || e)) + '<br>请确认 mods.json 已由 Actions 生成。</div>';
  }
})();

document.getElementById('q').addEventListener('input', render);
document.getElementById('cat').addEventListener('change', render);
</script>
</body>
</html>
