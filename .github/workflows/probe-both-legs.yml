name: 探活 — 两条部署腿都真的活着

# 本机到 *.pages.dev 连不通（实测 DNS 解析到 172.66.47.116 但 TLS 建不起来，而 GitHub Pages 与
# dl.jiangjiangze.icu 同时都通）⇒ 那是本机网络特异性，不能拿它判定线上死活。
# 权威判据只能从云端打：本工作流从 GitHub-hosted runner 打两个域名，各自要拿到「页面 + 数据」两样。
#
# 判据（缺一条就红）：
#   1. GitHub Pages 腿：GET / 200，且响应里同时有页面骨架与开源地址；
#   2. Cloudflare Pages 腿：GET / 200，同样要有开源地址；
#   3. 两条腿的 mods.json 条目数必须一致（内容漂移 = 有一条没更新）。

on:
  schedule:
    - cron: '53 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    name: 探活两条腿
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: GitHub Pages 腿
        id: gh
        run: |
          set -uo pipefail
          URL="https://jingjiangze.github.io/Stronghold-Protocol-Forge-Mods/"
          code=$(curl -sS -o /tmp/gh.html -w '%{http_code}' --max-time 30 "$URL")
          echo "  $URL -> $code"
          [ "$code" = "200" ] || { echo "::error::GitHub Pages 没回 200"; exit 1; }
          grep -q 'jingjiangze/Stronghold-Protocol-Forge-Mods' /tmp/gh.html \
            || { echo "::error::GitHub Pages 页面上没有开源地址"; exit 1; }
          curl -fsS --max-time 30 "${URL}mods.json" -o /tmp/gh.json
          N=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/gh.json','utf8')).mods.length")
          echo "gh_mods=$N" >> "$GITHUB_OUTPUT"
          echo "  条目数 $N"

      - name: Cloudflare Pages 腿
        id: cf
        run: |
          set -uo pipefail
          URL="https://stronghold-mods.pages.dev/"
          code=$(curl -sS -o /tmp/cf.html -w '%{http_code}' --max-time 30 "$URL")
          echo "  $URL -> $code"
          [ "$code" = "200" ] || { echo "::error::Cloudflare Pages 没回 200"; exit 1; }
          grep -q 'jingjiangze/Stronghold-Protocol-Forge-Mods' /tmp/cf.html \
            || { echo "::error::Cloudflare Pages 页面上没有开源地址"; exit 1; }
          curl -fsS --max-time 30 "${URL}mods.json" -o /tmp/cf.json
          N=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/cf.json','utf8')).mods.length")
          echo "cf_mods=$N" >> "$GITHUB_OUTPUT"
          echo "  条目数 $N"

      - name: 两条腿内容一致
        run: |
          set -uo pipefail
          echo "GitHub Pages ${{ steps.gh.outputs.gh_mods }} 条 / Cloudflare Pages ${{ steps.cf.outputs.cf_mods }} 条"
          if [ "${{ steps.gh.outputs.gh_mods }}" != "${{ steps.cf.outputs.cf_mods }}" ]; then
            echo "::error::两条腿条目数不一致 —— 有一条没更新"
            exit 1
          fi
          echo "✓ 两条腿一致"
