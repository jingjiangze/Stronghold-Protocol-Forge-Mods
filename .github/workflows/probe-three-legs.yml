name: 探活 — 三条腿都真的活着

# 三条腿，读同一个 modsite/ 目录：
#   ① mod.jiangjiangze.icu      CF Pages 主域（自定义域）
#   ② stronghold-mods.pages.dev CF Pages 默认域
#   ③ GitHub Pages              jingjiangze.github.io/Stronghold-Protocol-Forge-Mods/
#
# 为什么必须从云端探（本机探不出来）：
#   本机到 *.pages.dev 连不通（实测 DNS 能解析到 172.66.47.116 但 TLS 建不起来，
#   而 GitHub Pages 与 dl.jiangjiangze.icu 同时都通）⇒ 那是本机网络特异性，
#   拿它判定线上死活会得出错误结论。权威判据只能从 GitHub-hosted runner 打。
#
# 判据（缺一条就红）：
#   1. 每条腿 200；
#   2. 每条腿的页面上都有开源地址；
#   3. 三条腿的 mods.json 条目数一致（内容漂移 = 有一条没更新）；
#   4. **主域必须返回 text/html** —— 2026-10-20 之前 mod.jiangjiangze.icu 被
#      `*.jiangjiangze.icu` 通配符 DNS 吞进 P2P 隧道，返回 text/plain 的
#      o2p-platform 说明页。抓到那个形态就是域名又被抢回去了，必须响。

on:
  schedule:
    - cron: '53 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    name: 探活三条腿
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 主域 mod.jiangjiangze.icu
        id: mod
        run: |
          set -uo pipefail
          URL="https://mod.jiangjiangze.icu/"
          code=$(curl -sS -o /tmp/mod.html -w '%{http_code}' --max-time 30 "$URL")
          echo "  $URL -> $code"
          [ "$code" = "200" ] || { echo "::error::主域没回 200"; exit 1; }
          ct=$(curl -sS -D - -o /dev/null --max-time 30 "$URL" | awk 'tolower($1)=="content-type:"{print $2}' | tr -d '\r')
          echo "  Content-Type: $ct"
          case "$ct" in
            text/html*) ;;
            *) echo "::error::主域返回的不是 HTML（$ct）—— 域名可能又被通配符/别的服务抢回去了"; exit 1 ;;
          esac
          grep -q 'jingjiangze/Stronghold-Protocol-Forge-Mods' /tmp/mod.html \
            || { echo "::error::主域页面上没有开源地址"; exit 1; }
          curl -fsS --max-time 30 "${URL}mods.json" -o /tmp/mod.json
          N=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/mod.json','utf8')).mods.length")
          echo "mod_mods=$N" >> "$GITHUB_OUTPUT"
          echo "  条目数 $N"

      - name: Cloudflare Pages 默认域
        id: cf
        run: |
          set -uo pipefail
          URL="https://stronghold-mods.pages.dev/"
          code=$(curl -sS -o /tmp/cf.html -w '%{http_code}' --max-time 30 "$URL")
          echo "  $URL -> $code"
          [ "$code" = "200" ] || { echo "::error::CF Pages 默认域没回 200"; exit 1; }
          grep -q 'jingjiangze/Stronghold-Protocol-Forge-Mods' /tmp/cf.html \
            || { echo "::error::CF Pages 默认域页面上没有开源地址"; exit 1; }
          curl -fsS --max-time 30 "${URL}mods.json" -o /tmp/cf.json
          N=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/cf.json','utf8')).mods.length")
          echo "cf_mods=$N" >> "$GITHUB_OUTPUT"
          echo "  条目数 $N"

      - name: GitHub Pages
        id: gh
        run: |
          set -uo pipefail
          URL="https://jingjiangze.github.io/Stronghold-Protocol-Forge-Mods/"
          code=$(curl -sS -o /tmp/gh.html -w '%{http_code}' --max-time 30 "$URL")
          echo "  $URL -> $code"
          [ "$code" = "200" ] || { echo "::error::GitHub Pages 没回 200"; exit 1; }
          grep -q 'jingjiangze/Stronghold-Protocol-Forge-Mods' /tmp/gh.html \
            || { echo "::error::GitHub Pages 页面上没有开源地址"; exit 1; }
          curl -fsS --max-time 30 "${URL}mods.json" -o /tmp/gh.json
          N=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/gh.json','utf8')).mods.length")
          echo "gh_mods=$N" >> "$GITHUB_OUTPUT"
          echo "  条目数 $N"

      - name: 三条腿内容一致
        run: |
          set -uo pipefail
          M="${{ steps.mod.outputs.mod_mods }}"
          C="${{ steps.cf.outputs.cf_mods }}"
          G="${{ steps.gh.outputs.gh_mods }}"
          echo "主域 $M / CF 默认域 $C / GitHub Pages $G"
          if [ "$M" != "$C" ] || [ "$M" != "$G" ]; then
            echo "::error::三条腿条目数不一致 —— 有一条没更新"
            exit 1
          fi
          echo "✓ 三条腿一致"
