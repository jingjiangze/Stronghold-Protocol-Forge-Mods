name: sync-upstream-main

# 把上游 XiaMo233M/Stronghold-Protocol-Forge-Mods 的 main **快进**到本 fork 的 main。
#
# 分工（2026-10-14 定）：
#   - `main` = 纯镜像，不含本仓库自有的提交 ⇒ 这里只做 fast-forward，**绝不 force、绝不 merge**。
#   - `master` = 产品分支（站点改动都在这条上，本工作流就住在它上面）。
#
# ⚠ 关于 on.schedule：公开仓库被 fork 后 GitHub **默认禁用** scheduled workflows
#   （docs.github.com/actions/managing-workflow-runs/disabling-and-enabling-a-workflow），
#   同级 fork 实测 `event=schedule` 的运行数为 0，`PUT .../workflows/{id}/enable` 也救不回来。
#   所以节拍靠外部触发：`workflow_dispatch`（UI/CLI 手点）或 `repository_dispatch`
#   （外部闹钟打，types 用 `sync-upstream-main`）。schedule 这一段保留 —— 本仓脱离 fork 后自动生效。

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sync-upstream-main]
  schedule:
    - cron: '17 1,7,13,19 * * *'

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/XiaMo233M/Stronghold-Protocol-Forge-Mods.git

jobs:
  fast-forward-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward main to upstream
        id: sync
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main
          UP="$(git rev-parse FETCH_HEAD)"
          CUR="$(git rev-parse HEAD)"
          echo "upstream =$UP"
          echo "fork main =$CUR"
          echo "up=$UP" >> "$GITHUB_OUTPUT"
          echo "cur=$CUR" >> "$GITHUB_OUTPUT"
          if [ "$UP" = "$CUR" ]; then
            echo "main 已经是上游最新 —— 无事可做"
            echo "moved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 镜像只许是上游的祖先。反过来 = 有人往 main 提了自有提交，
          # 那必须人工搬到 master，这里不猜、不强推、不动 master。
          if ! git merge-base --is-ancestor "$CUR" "$UP"; then
            echo "::error::main 上有上游没有的提交（$CUR）。main 必须是纯镜像：把这些提交改到 master 上，再重跑本工作流。"
            exit 1
          fi
          git push origin "$UP:refs/heads/main"
          echo "moved=true" >> "$GITHUB_OUTPUT"
          echo "n=$(git rev-list --count "$CUR..$UP")" >> "$GITHUB_OUTPUT"

      - name: Report (main moved; master is only measured, never touched)
        run: |
          set -uo pipefail
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          UP="${{ steps.sync.outputs.up }}"
          M="$(git rev-parse refs/remotes/origin/master)"
          BEHIND="$(git rev-list --count "$M..$UP")"
          AHEAD="$(git rev-list --count "$UP..$M")"
          {
            echo "### 上游同步"
            if [ "${{ steps.sync.outputs.moved }}" = "true" ]; then
              echo "- main 快进：\`${{ steps.sync.outputs.cur }}\` → \`$UP\`（${{ steps.sync.outputs.n }} 个提交）"
            else
              echo "- main 已是上游最新：\`$UP\`"
            fi
            echo "- master：自有提交 **$AHEAD** 个，落后上游 **$BEHIND** 个"
            if [ "$BEHIND" -gt 0 ]; then
              echo "- ⚠ master 还没跟上这一轮上游，需要再合一次（本工作流不动 master）"
            else
              echo "- master 已包含上游全部提交"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
